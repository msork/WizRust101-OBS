<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Live overlay SSE anchor regression</title></head>
<body>
  <iframe id="overlay" src="/overlay?debug-layout=1" width="1920" height="1080"></iframe>
  <pre id="test-result" data-result="running">Waiting for the live overlay...</pre>
  <script>
    (() => {
      const frame = document.getElementById('overlay');
      const output = document.getElementById('test-result');
      const fail = (error) => {
        output.dataset.result = 'fail';
        output.textContent = `FAIL: ${error.message || error}`;
        frame.contentWindow?.__overlayEvents?.close();
        frame.remove();
      };
      const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const waitFor = async (predicate, message) => {
        const deadline = performance.now() + 10000;
        while (performance.now() < deadline) {
          if (predicate()) return;
          await delay(25);
        }
        throw new Error(message);
      };

      frame.addEventListener('load', async () => {
        const watchdog = setTimeout(() => fail(`timed out; trace=${JSON.stringify(frame.contentWindow?.__overlayLayoutTrace || [])}`), 12000);
        try {
          await waitFor(() => frame.contentWindow.__overlayLayoutTrace?.some((entry) => entry.phase === 'after-roster'), 'overlay did not render its initial SSE state');
          const target = frame.contentWindow;
          const captures = [];
          let previous = null;
          let previousPartyTop = null;
          let previousPartyHeight = null;

          for (const rosterSize of [0, 1, 2, 3]) {
            const oldRevision = target.__overlayLastRenderedRevision;
            const response = await fetch(`/__test/party/${rosterSize}`, { method: 'POST' });
            if (!response.ok) throw new Error(`fixture rejected roster size ${rosterSize}`);
            const changed = await response.json();
            await waitFor(() => target.__overlayLastRenderedRevision >= changed.revision, `SSE update ${changed.revision} was not rendered`);
            const entries = target.__overlayLayoutTrace.filter((entry) => entry.revision === changed.revision);
            const before = entries.find((entry) => entry.phase === 'before-roster');
            const after = entries.find((entry) => entry.phase === 'after-roster');
            if (!before || !after) throw new Error(`missing before/after geometry for roster ${rosterSize}`);
            if (changed.revision <= oldRevision) throw new Error('fixture state did not advance');
            if (after.rosterSize !== rosterSize) throw new Error(`expected ${rosterSize} guests, rendered ${after.rosterSize}`);
            if (previous && (after.owner.x !== previous.owner.x || after.owner.y !== previous.owner.y)) {
              throw new Error(`owner moved at ${rosterSize + 1}/4: ${JSON.stringify({ before: previous.owner, after: after.owner })}`);
            }
            if (rosterSize > 0 && after.party.y < after.owner.y + after.measuredOwnerHeight) {
              throw new Error(`party layer moved above the owner at ${rosterSize + 1}/4`);
            }
            if (rosterSize > 0) {
              if (Math.abs(after.party.x - after.owner.x) > 0.1) throw new Error(`party x diverged from owner at ${rosterSize + 1}/4`);
              if (previousPartyTop !== null && Math.abs(after.party.y - previousPartyTop) > 0.1) throw new Error(`party layer top shifted at ${rosterSize + 1}/4`);
              if (previousPartyHeight !== null && rosterSize > (previous?.rosterSize || 0) && after.party.height <= previousPartyHeight) {
                throw new Error(`party roster did not grow downward at ${rosterSize + 1}/4`);
              }
              previousPartyTop = after.party.y;
              previousPartyHeight = after.party.height;
            } else {
              previousPartyTop = null;
              previousPartyHeight = null;
            }
            const geometry = (entry) => ({
              owner: { x: entry.owner.x, y: entry.owner.y, top: entry.owner.top, left: entry.owner.left, transform: entry.owner.transform, inlineTop: entry.owner.inlineTop, inlineLeft: entry.owner.inlineLeft },
              party: { x: entry.party.x, y: entry.party.y, height: entry.party.height, transform: entry.party.transform },
              viewport: entry.viewport,
              configured: entry.configured,
              measuredOwnerHeight: entry.measuredOwnerHeight,
              scale: entry.scale,
              partyCardScale: entry.partyCardScale,
              backgroundOpacity: entry.backgroundOpacity,
              preset: entry.preset,
            });
            captures.push({ occupancy: `${rosterSize + 1}/4`, before: geometry(before), after: geometry(after) });
            previous = { ...after, rosterSize };
          }

          for (const [preset, ownerScale, partyScale] of [['compact', 0.9, 0.88], ['minimal', 0.82, 0.76], ['default', 1, 1]]) {
            const oldRevision = target.__overlayLastRenderedRevision;
            const response = await fetch(`/__test/preset/${preset}`, { method: 'POST' });
            if (!response.ok) throw new Error(`fixture rejected preset ${preset}`);
            const changed = await response.json();
            await waitFor(() => target.__overlayLastRenderedRevision >= changed.revision, `SSE preset ${preset} was not rendered`);
            const after = target.__overlayLayoutTrace.find((entry) => entry.revision === changed.revision && entry.phase === 'after-roster');
            if (!after || changed.revision <= oldRevision) throw new Error(`missing live render for preset ${preset}`);
            if (target.document.documentElement.dataset.overlayPreset !== preset || after.preset !== preset) {
              throw new Error(`preset ${preset} did not reach the live page`);
            }
            if (after.owner.x !== previous.owner.x || after.owner.y !== previous.owner.y) {
              throw new Error(`owner moved when applying ${preset} preset`);
            }
            if (Math.abs(after.scale - ownerScale) > 0.001 || Math.abs(after.partyCardScale - partyScale) > 0.001) {
              throw new Error(`preset ${preset} scales were not applied`);
            }
            const partyTransformScale = new DOMMatrixReadOnly(after.party.transform).a;
            if (Math.abs(partyTransformScale - ownerScale * partyScale) > 0.002) {
              throw new Error(`party-card scale for ${preset} was not applied`);
            }
            captures.push({ preset, owner: { x: after.owner.x, y: after.owner.y }, ownerTransform: after.owner.transform, partyTransform: after.party.transform, configured: after.configured });
            previous = { ...after, rosterSize: 3 };
          }

          const oldRevision = target.__overlayLastRenderedRevision;
          const customizedResponse = await fetch('/__test/customize', { method: 'POST' });
          if (!customizedResponse.ok) throw new Error('fixture rejected presentation customization');
          const customized = await customizedResponse.json();
          await waitFor(() => target.__overlayLastRenderedRevision >= customized.revision, 'custom presentation was not delivered over SSE');
          const customRender = target.__overlayLayoutTrace.find((entry) => entry.revision === customized.revision && entry.phase === 'after-roster');
          if (!customRender || customized.revision <= oldRevision) throw new Error('missing customized presentation render');
          const customOwnerScale = new DOMMatrixReadOnly(customRender.owner.transform).a;
          const customPartyScale = new DOMMatrixReadOnly(customRender.party.transform).a;
          if (Math.abs(customOwnerScale - 1.1) > 0.002 || Math.abs(customPartyScale - 0.77) > 0.002) {
            throw new Error('custom owner/Party scales were not applied');
          }
          if (customRender.cssVariables.primaryBackground !== '0.485' || customRender.cssVariables.partyBackground !== '0.455') {
            throw new Error('card background opacity was not applied');
          }
          if (customRender.cssVariables.transitionDuration !== '6s') throw new Error('zone transition duration was not applied');
          for (const selector of ['#primary-world-icon', '#primary-school-icon', '.party-world-icon', '.party-school-icon']) {
            if (getComputedStyle(target.document.querySelector(selector)).display !== 'none') throw new Error(`${selector} visibility toggle was not applied`);
          }
          if (customRender.owner.x !== previous.owner.x || customRender.owner.y !== previous.owner.y) {
            throw new Error('custom presentation moved the owner anchor');
          }
          if (customRender.party.y < customRender.owner.y + customRender.measuredOwnerHeight + 6.9) {
            throw new Error('customized Party layer is not anchored below owner');
          }
          captures.push({ customized: true, ownerScale: customOwnerScale, partyScale: customPartyScale, backgroundOpacity: 0.5, transitionDuration: '6s', iconsHidden: true });
          previous = { ...customRender, rosterSize: 3 };

          const beforeLeaveRevision = target.__overlayLastRenderedRevision;
          const leaveResponse = await fetch('/__test/party/0', { method: 'POST' });
          const left = await leaveResponse.json();
          await waitFor(() => target.__overlayLastRenderedRevision >= left.revision, 'final leave state was not rendered');
          const afterLeave = target.__overlayLayoutTrace.find((entry) => entry.revision === left.revision && entry.phase === 'after-roster');
          if (left.revision <= beforeLeaveRevision || !afterLeave || afterLeave.rosterSize !== 0) throw new Error('party did not return to 1/4');
          if (afterLeave.owner.x !== previous.owner.x || afterLeave.owner.y !== previous.owner.y) throw new Error('owner moved when Party members left');

          output.dataset.result = 'pass';
          output.textContent = JSON.stringify({ result: 'PASS', captures }, null, 2);
          clearTimeout(watchdog);
          target.__overlayEvents.close();
          frame.remove();
        } catch (error) {
          fail(error);
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
