<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
    <title>WizRust101-OBS</title>
  </head>
  <body>
    <main id="overlay">
      <section id="primary" class="primary" aria-label="Your wizard">
        <img id="primary-world-icon" class="world-icon primary-world-icon" alt="">
        <div class="primary-copy">
          <div class="eyebrow">YOUR WIZARD</div>
          <div id="identity" class="identity"></div>
          <div class="location primary-location">
            <span id="world-name" class="world-name"></span>
            <span id="zone-name" class="zone-name"></span>
          </div>
        </div>
      </section>
      <section id="party" class="party" aria-label="Other wizards in your party"></section>
      <section id="arrival" class="arrival" aria-live="polite">
        <img id="arrival-icon" class="arrival-icon" alt="">
        <div class="arrival-copy">
          <div id="arrival-world" class="arrival-world"></div>
          <div id="arrival-zone" class="arrival-zone"></div>
        </div>
      </section>
      <aside id="party-notice" class="party-notice" aria-live="polite">
        <span class="notice-sigil" aria-hidden="true">✧</span>
        <span id="party-notice-text"></span>
      </aside>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let schoolPalette = {};
      let previousZone = null;
      let previousParty = null;
      let hideTimer;
      let noticeTimer;

      function schoolClass(school) {
        const value = String(school).toLowerCase();
        return ['fire', 'ice', 'storm', 'myth', 'life', 'death', 'balance'].includes(value) ? value : 'balance';
      }

      function applySchoolPalette(element, school) {
        const colors = schoolPalette[school] || { primary: '#4F4951', secondary: '#8F8792' };
        element.style.setProperty('--school-primary', colors.primary);
        element.style.setProperty('--school-secondary', colors.secondary);
      }

      function visible(value) {
        return typeof value === 'string' && value.trim() && value !== 'Unknown' ? value : '';
      }

      function setWorldIcon(image, key) {
        const safeKey = /^[a-z0-9]+$/.test(key || '') ? key : 'wizard101';
        const source = `/worlds/${safeKey}`;
        if (image.getAttribute('src') !== source) {
          image.classList.add('changing');
          image.onload = () => image.classList.remove('changing');
          image.onerror = () => {
            image.onerror = null;
            image.classList.remove('changing');
            image.src = '/worlds/wizard101';
          };
          image.src = source;
        }
      }

      function announce(message) {
        $('party-notice-text').textContent = message;
        $('party-notice').classList.remove('show');
        void $('party-notice').offsetWidth;
        $('party-notice').classList.add('show');
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => $('party-notice').classList.remove('show'), 3600);
      }

      function showPartyChange(before, after) {
        const joined = [...after.keys()].filter((id) => !before.has(id));
        const left = [...before.keys()].filter((id) => !after.has(id));
        if (joined.length) {
          announce(joined.length === 1 ? `${after.get(joined[0]).name} joined your party` : `${joined.length} wizards joined your party`);
          return;
        }
        if (left.length) {
          announce(left.length === 1 ? `${before.get(left[0]).name} left your party` : `${left.length} wizards left your party`);
          return;
        }
        for (const [id, member] of after) {
          const prior = before.get(id);
          if (prior && (prior.world !== member.world || prior.zone !== member.zone || prior.active !== member.active)) {
            const zone = visible(member.zone);
            if (member.active && zone) announce(`${member.name} arrived in ${zone}`);
            else if (!member.active) announce(`${member.name} left the Spiral`);
            return;
          }
        }
      }

      function renderParty(members) {
        const party = $('party');
        party.replaceChildren();
        for (const wizard of members) {
          const card = document.createElement('article');
          card.className = 'party-card';
          applySchoolPalette(card, wizard.school);
          const marker = document.createElement('div');
          marker.className = 'party-marker';
          marker.textContent = wizard.active ? 'ONLINE · IN THE SPIRAL' : 'ONLINE · BETWEEN WORLDS';
          const name = document.createElement('div');
          name.className = `party-name ${schoolClass(wizard.school)}`;
          applySchoolPalette(name, wizard.school);
          name.textContent = wizard.name;
          const school = document.createElement('div');
          school.className = `party-school ${schoolClass(wizard.school)}`;
          applySchoolPalette(school, wizard.school);
          school.textContent = wizard.school;
          const location = document.createElement('div');
          location.className = 'party-location';
          const worldIcon = document.createElement('img');
          worldIcon.className = 'world-icon party-world-icon';
          worldIcon.alt = '';
          setWorldIcon(worldIcon, wizard.world_icon);
          location.append(worldIcon);
          const zone = visible(wizard.zone);
          if (zone) {
            const text = document.createElement('span');
            text.textContent = zone;
            location.append(text);
          }
          card.append(marker, name, school, location);
          party.append(card);
        }
      }

      function render(state) {
        const options = state.overlay || {};
        document.documentElement.style.setProperty('--x', `${options.x_percent ?? 2}%`);
        document.documentElement.style.setProperty('--y', `${options.y_percent ?? 35}%`);
        document.documentElement.style.setProperty('--scale', options.scale ?? 1);
        document.documentElement.style.setProperty('--opacity', options.opacity ?? 0.92);
        document.documentElement.style.setProperty('--transition-duration', `${options.transition_seconds ?? 4}s`);
        $('primary').classList.toggle('hidden', options.character_location === false);

        if (state.wizard) {
          $('identity').textContent = `${state.wizard.name} · ${state.wizard.school}`;
          $('identity').className = `identity ${schoolClass(state.wizard.school)}`;
          applySchoolPalette($('identity'), state.wizard.school);
        } else {
          $('identity').textContent = 'Choose a character in Settings';
          $('identity').className = 'identity';
        }

        const world = visible(state.world);
        const zone = visible(state.zone);
        $('world-name').textContent = world;
        $('world-name').classList.toggle('hidden', !world);
        $('zone-name').textContent = zone;
        $('zone-name').classList.toggle('hidden', !zone);
        setWorldIcon($('primary-world-icon'), state.world_icon);

        const members = state.party || [];
        const nextParty = new Map(members.map((member) => [member.peer_id, member]));
        renderParty(members);
        if (previousParty !== null) showPartyChange(previousParty, nextParty);
        previousParty = nextParty;

        if (options.zone_transition !== false && state.active && state.raw_zone && previousZone !== null && state.raw_zone !== previousZone) {
          $('arrival-world').textContent = world;
          $('arrival-world').classList.toggle('hidden', !world);
          $('arrival-zone').textContent = zone;
          $('arrival-zone').classList.toggle('hidden', !zone);
          setWorldIcon($('arrival-icon'), state.world_icon);
          $('arrival').classList.remove('show');
          void $('arrival').offsetWidth;
          $('arrival').classList.add('show');
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => $('arrival').classList.remove('show'), (options.transition_seconds ?? 4) * 1000);
        }
        previousZone = state.raw_zone;
      }

      Promise.all([fetch('/school-palette.json').then((response) => response.json()), fetch('/state').then((response) => response.json())])
        .then(([palette, state]) => { schoolPalette = palette; render(state); })
        .catch(() => {});
      const events = new EventSource('/events');
      events.addEventListener('state', (event) => {
        const state = JSON.parse(event.data);
        if (Object.keys(schoolPalette).length) render(state);
        else fetch('/school-palette.json').then((response) => response.json()).then((palette) => { schoolPalette = palette; render(state); }).catch(() => render(state));
      });
    </script>
  </body>
</html>
