<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
    <title>WizRust101 OBS</title>
  </head>
  <body>
    <main id="overlay">
      <svg class="sigil-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <symbol id="world-spiral" viewBox="0 0 40 40"><path d="M20 4 35 13v14L20 36 5 27V13z M20 10a10 10 0 1 0 10 10M20 15a5 5 0 1 0 5 5"/></symbol>
          <symbol id="world-flame" viewBox="0 0 40 40"><path d="M21 4c2 8-7 9-4 17 1-4 4-5 7-8 8 10 7 19-1 23-9 2-16-4-13-13 2-6 8-10 11-19z M19 25c-4 5-2 9 2 10 4-2 4-6 1-9"/></symbol>
          <symbol id="world-star" viewBox="0 0 40 40"><path d="m20 3 4.5 11.5L37 16l-9.5 7.5L30 36l-10-7-10 7 2.5-12.5L3 16l12.5-1.5z M20 11v18M11 20h18"/></symbol>
          <symbol id="world-leaf" viewBox="0 0 40 40"><path d="M34 6C17 5 7 12 7 24c0 8 9 12 15 7 7-5 8-15 12-25z M8 34c6-9 12-14 21-20M14 24l-1-8M22 18l7 1"/></symbol>
          <symbol id="world-moon" viewBox="0 0 40 40"><path d="M28 5a16 16 0 1 0 7 25A16 16 0 0 1 28 5z M8 13h7l3 5h7l4 6M13 30l4-5"/></symbol>
          <symbol id="world-crown" viewBox="0 0 40 40"><path d="m5 12 9 7 6-13 6 13 9-7-4 20H9z M10 26h20M9 35h22"/></symbol>
          <symbol id="world-mountain" viewBox="0 0 40 40"><path d="m3 33 12-24 6 12 4-7 12 19z M15 9l4 8-5-2M25 14l3 8-4-2M7 28h7M27 29h7"/></symbol>
          <symbol id="world-unknown" viewBox="0 0 40 40"><path d="M20 4 35 13v14L20 36 5 27V13z M15 15a5 5 0 1 1 8 4c-2 2-3 2-3 6M20 30v1"/></symbol>
        </defs>
      </svg>
      <section id="primary" class="primary" aria-label="Your wizard">
        <span class="crest" aria-hidden="true">✧</span>
        <span class="crest world-icon" aria-hidden="true"><svg><use id="primary-world-icon" href="#world-unknown"></use></svg></span>
        <div class="primary-copy">
          <div class="eyebrow">YOUR WIZARD</div>
          <div id="identity" class="identity"></div>
          <div id="location" class="legacy-location"></div>
          <div class="location primary-location"><span id="world-name" class="world-name"></span><span id="zone-name" class="zone-name"></span></div>
          <div id="session" class="session"></div>
        </div>
      </section>
      <section id="party" class="party" aria-label="Other wizards in your party"></section>
      <section id="arrival" class="arrival" aria-live="polite">
        <div id="arrival-world" class="arrival-world"></div>
        <div id="arrival-zone" class="arrival-zone"></div>
      </section>
      <aside id="party-notice" class="party-notice" aria-live="polite">
        <span class="notice-sigil" aria-hidden="true">✧</span>
        <span id="party-notice-text"></span>
      </aside>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let current = { active: false, session_seconds: 0 };
      let receivedAt = Date.now();
      let previousZone = null;
      let previousParty = null;
      let hideTimer;
      let noticeTimer;

      function time(seconds) {
        const value = Math.max(0, Math.floor(seconds));
        return `${String(Math.floor(value / 3600)).padStart(2, '0')}:${String(Math.floor(value / 60) % 60).padStart(2, '0')}:${String(value % 60).padStart(2, '0')}`;
      }

      function schoolClass(school) {
        const value = String(school).toLowerCase();
        return ['fire', 'ice', 'storm', 'myth', 'life', 'death'].includes(value) ? value : 'balance';
      }

      function announce(message) {
        $('party-notice-text').textContent = message;
        $('party-notice').classList.remove('show');
        void $('party-notice').offsetWidth;
        $('party-notice').classList.add('show');
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(() => $('party-notice').classList.remove('show'), 3600);
      }

      function showPartyChange(before, after) {
        const joined = [...after.keys()].filter((id) => !before.has(id));
        const left = [...before.keys()].filter((id) => !after.has(id));
        if (joined.length) {
          announce(joined.length === 1 ? `${after.get(joined[0]).name} joined the company` : `${joined.length} wizards joined the company`);
          return;
        }
        if (left.length) {
          announce(left.length === 1 ? `${before.get(left[0]).name} left the company` : `${left.length} wizards left the company`);
          return;
        }
        for (const [id, member] of after) {
          const prior = before.get(id);
          if (prior && (prior.world !== member.world || prior.zone !== member.zone || prior.active !== member.active)) {
            const place = member.zone || 'an unknown location';
            announce(member.active && place ? `${member.name} arrived in ${place}` : `${member.name} left the Spiral`);
            return;
          }
        }
      }

      function renderParty(members) {
        const party = $('party');
        party.replaceChildren();
        for (const wizard of members) {
          const card = document.createElement('article');
          card.className = 'party-card';
          const marker = document.createElement('div');
          marker.className = 'party-marker';
          marker.textContent = wizard.active ? 'ONLINE · IN THE SPIRAL' : 'ONLINE · BETWEEN WORLDS';
          const name = document.createElement('div');
          name.className = `party-name ${schoolClass(wizard.school)}`;
          name.textContent = wizard.name;
          const school = document.createElement('div');
          school.className = 'party-school';
          school.textContent = wizard.school;
          const location = document.createElement('div');
          location.className = 'party-location';
          location.textContent = wizard.active
            ? [wizard.world, wizard.zone].filter(Boolean).join(' — ') || 'Location unknown'
            : 'Location not currently observed';
          location.textContent = wizard.zone || 'Location unknown';
          const worldIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          worldIcon.classList.add('world-icon', 'party-world-icon');
          worldIcon.setAttribute('aria-hidden', 'true');
          const iconUse = document.createElementNS('http://www.w3.org/2000/svg', 'use');
          iconUse.setAttribute('href', `#world-${wizard.world_icon || 'unknown'}`);
          worldIcon.append(iconUse);
          location.prepend(worldIcon);
          card.append(marker, name, school, location);
          party.append(card);
        }
      }

      function render(state) {
        current = state;
        receivedAt = Date.now();
        const options = state.overlay || {};
        document.documentElement.style.setProperty('--x', `${options.x_percent ?? 4}%`);
        document.documentElement.style.setProperty('--y', `${options.y_percent ?? 87}%`);
        document.documentElement.style.setProperty('--scale', options.scale ?? 1);
        document.documentElement.style.setProperty('--opacity', options.opacity ?? 0.92);
        document.documentElement.style.setProperty('--transition-duration', `${options.transition_seconds ?? 4}s`);
        $('primary').classList.toggle('hidden', options.character_location === false);

        if (state.wizard) {
          $('identity').textContent = `${state.wizard.name} · ${state.wizard.school}`;
          $('identity').className = `identity ${schoolClass(state.wizard.school)}`;
        } else {
          $('identity').textContent = 'Choose a wizard in Spellbook Settings';
          $('identity').className = 'identity';
        }
        $('location').textContent = [state.world, state.zone].filter(Boolean).join(' — ');
        $('world-name').textContent = state.world || 'Unknown World';
        $('zone-name').textContent = state.zone || 'Location unknown';
        $('primary-world-icon').setAttribute('href', `#world-${state.world_icon || 'unknown'}`);
        $('session').textContent = state.active ? `SESSION  ${time(state.session_seconds)}` : '';

        const members = state.party || [];
        const nextParty = new Map(members.map((member) => [member.peer_id, member]));
        renderParty(members);
        if (previousParty !== null) showPartyChange(previousParty, nextParty);
        previousParty = nextParty;

        if (options.zone_transition !== false && state.active && state.raw_zone && previousZone !== null && state.raw_zone !== previousZone) {
          $('arrival-world').textContent = state.world || '';
          $('arrival-zone').textContent = state.zone || 'Location unknown';
          $('arrival').classList.remove('show');
          void $('arrival').offsetWidth;
          $('arrival').classList.add('show');
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => $('arrival').classList.remove('show'), (options.transition_seconds ?? 4) * 1000);
        }
        previousZone = state.raw_zone;
      }

      setInterval(() => {
        if (current.active) $('session').textContent = `SESSION  ${time(current.session_seconds + Math.floor((Date.now() - receivedAt) / 1000))}`;
      }, 1000);
      fetch('/state').then((response) => response.json()).then(render).catch(() => {});
      const events = new EventSource('/events');
      events.addEventListener('state', (event) => render(JSON.parse(event.data)));
    </script>
  </body>
</html>
