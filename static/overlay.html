<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/style.css">
    <title>WizRust101-OBS</title>
  </head>
  <body>
    <section id="primary" class="primary" aria-label="Your wizard">
      <img id="primary-world-icon" class="world-icon primary-world-icon" alt="">
      <div class="primary-copy">
        <div class="eyebrow">YOUR WIZARD</div>
        <div id="identity" class="identity">
          <img id="primary-school-icon" class="school-icon" alt="">
          <span id="primary-name" class="primary-name"></span>
          <span id="primary-school" class="primary-school"></span>
        </div>
        <div class="location primary-location">
          <span id="world-name" class="world-name"></span>
          <span id="zone-name" class="zone-name"></span>
        </div>
      </div>
    </section>
    <section id="party" class="party" aria-label="Other wizards in your party"></section>
    <section id="arrival" class="arrival" aria-live="polite">
      <img id="arrival-icon" class="arrival-icon" alt="">
      <div class="arrival-copy">
        <div id="arrival-world" class="arrival-world"></div>
        <div id="arrival-zone" class="arrival-zone"></div>
      </div>
    </section>
    <script>
      const $ = (id) => document.getElementById(id);
      let schoolPalette = {};
      let previousZone = null;
      let hideTimer;
      const partyCards = new Map();
      const layoutDebug = new URLSearchParams(window.location.search).get('debug-layout') === '1';
      if (layoutDebug) window.__overlayLayoutTrace = [];

      function traceOverlayLayout(phase, state) {
        if (!layoutDebug) return;
        const owner = $('primary');
        const party = $('party');
        const ownerRect = owner.getBoundingClientRect();
        const partyRect = party.getBoundingClientRect();
        const style = getComputedStyle(owner);
        const trace = {
          phase,
          revision: state.revision,
          rosterSize: (state.party || []).length,
          owner: { x: ownerRect.x, y: ownerRect.y, width: ownerRect.width, height: ownerRect.height, top: style.top, left: style.left, transform: style.transform, inlineTop: owner.style.top, inlineLeft: owner.style.left, inlinePosition: owner.style.position, display: style.display, padding: style.padding, borderLeftWidth: style.borderLeftWidth, borderRadius: style.borderRadius, backgroundColor: style.backgroundColor, nameFontSize: getComputedStyle($('primary-name')).fontSize },
          party: { x: partyRect.x, y: partyRect.y, top: getComputedStyle(party).top, transform: getComputedStyle(party).transform, height: partyRect.height },
          partyCard: (() => { const card = party.querySelector('.party-card'); if (!card) return null; const cardStyle = getComputedStyle(card); const cardRect = card.getBoundingClientRect(); return { display: cardStyle.display, width: cardRect.width, height: cardRect.height, padding: cardStyle.padding, clipPath: cardStyle.clipPath, borderLeftWidth: cardStyle.borderLeftWidth, borderRadius: cardStyle.borderRadius, backgroundColor: cardStyle.backgroundColor, nameFontSize: getComputedStyle(card.querySelector('.party-name')).fontSize }; })(),
          viewport: { width: window.innerWidth, height: window.innerHeight },
          configured: { xPercent: state.overlay.x_percent, yPercent: state.overlay.y_percent },
          measuredOwnerHeight: ownerRect.height,
          scale: state.overlay.scale,
          partyCardScale: state.overlay.party_card_scale,
          backgroundOpacity: state.overlay.background_opacity,
          preset: state.overlay.preset,
          showWorldIcon: state.overlay.show_world_icon,
          showSchoolIcon: state.overlay.show_school_icon,
          cssVariables: {
            x: document.documentElement.style.getPropertyValue('--x'),
            y: document.documentElement.style.getPropertyValue('--y'),
            scale: document.documentElement.style.getPropertyValue('--scale'),
            ownerHeight: document.documentElement.style.getPropertyValue('--primary-scaled-height'),
            primaryBackground: document.documentElement.style.getPropertyValue('--primary-bg-strong'),
            partyBackground: document.documentElement.style.getPropertyValue('--party-bg-strong'),
            transitionDuration: document.documentElement.style.getPropertyValue('--transition-duration'),
          },
        };
        window.__overlayLayoutTrace.push(trace);
        console.log('[overlay-layout]', JSON.stringify(trace));
        if (phase === 'after-roster') {
          window.__overlayLastRenderedRevision = state.revision;
          window.dispatchEvent(new CustomEvent('overlay-state-rendered', { detail: trace }));
        }
      }

      function schoolClass(school) {
        const value = String(school).toLowerCase();
        return ['fire', 'ice', 'storm', 'myth', 'life', 'death', 'balance'].includes(value) ? value : 'balance';
      }

      function schoolIconKey(school) {
        return schoolClass(school);
      }

      function applySchoolPalette(element, school) {
        const colors = schoolPalette[school] || { primary: '#4F4951', secondary: '#8F8792' };
        element.style.setProperty('--school-primary', colors.primary);
        element.style.setProperty('--school-secondary', colors.secondary);
      }

      function visible(value) {
        return typeof value === 'string' && value.trim() && value !== 'Unknown' ? value : '';
      }

      function setWorldIcon(image, key) {
        const safeKey = /^[a-z0-9]+$/.test(key || '') ? key : 'wizard101';
        const source = `/worlds/${safeKey}`;
        if (image.getAttribute('src') !== source) {
          image.classList.add('changing');
          image.onload = () => image.classList.remove('changing');
          image.onerror = () => {
            image.onerror = null;
            image.classList.remove('changing');
            image.src = '/worlds/wizard101';
          };
          image.src = source;
        }
      }

      function setSchoolIcon(image, school) {
        const source = `/schools/${schoolIconKey(school)}`;
        if (image.getAttribute('src') !== source) image.src = source;
      }

      function updatePartyAnchor() {
        const height = $('primary').getBoundingClientRect().height;
        document.documentElement.style.setProperty('--primary-scaled-height', `${height}px`);
      }

      function createPartyCard() {
        const card = document.createElement('article');
        card.className = 'party-card';
        const marker = document.createElement('div');
        marker.className = 'party-marker';
        const identity = document.createElement('div');
        identity.className = 'party-identity';
        const school = document.createElement('img');
        school.className = 'school-icon party-school-icon';
        school.alt = '';
        const name = document.createElement('span');
        name.className = 'party-name';
        identity.append(school, name);
        const location = document.createElement('div');
        location.className = 'party-location';
        const world = document.createElement('img');
        world.className = 'world-icon party-world-icon';
        world.alt = '';
        const zone = document.createElement('span');
        location.append(world, zone);
        card.append(marker, identity, location);
        return { card, marker, school, name, world, zone };
      }

      function renderParty(members, options) {
        const party = $('party');
        const roster = members.slice(0, 3);
        const wanted = new Set(roster.map((member) => member.peer_id));
        for (const [id, entry] of partyCards) {
          if (!wanted.has(id)) {
            entry.card.remove();
            partyCards.delete(id);
          }
        }
        roster.forEach((wizard, index) => {
          let entry = partyCards.get(wizard.peer_id);
          if (!entry) {
            entry = createPartyCard();
            partyCards.set(wizard.peer_id, entry);
          }
          applySchoolPalette(entry.card, wizard.school);
          entry.marker.textContent = wizard.active ? 'ONLINE · IN THE SPIRAL' : 'ONLINE · BETWEEN WORLDS';
          entry.name.textContent = wizard.name;
          setSchoolIcon(entry.school, wizard.school);
          entry.school.classList.toggle('hidden', options.show_school_icon === false);
          setWorldIcon(entry.world, wizard.world_icon);
          entry.world.classList.toggle('hidden', options.show_world_icon === false);
          entry.card.classList.toggle('hide-school-icon', options.show_school_icon === false);
          entry.card.classList.toggle('hide-world-icon', options.show_world_icon === false);
          entry.zone.textContent = visible(wizard.zone);
          entry.zone.classList.toggle('hidden', !visible(wizard.zone));
          const atPosition = party.children[index];
          if (atPosition !== entry.card) party.insertBefore(entry.card, atPosition || null);
        });
      }

      function render(state) {
        const options = state.overlay || {};
        const x = options.x_percent ?? 0.6;
        const y = options.y_percent ?? 16;
        const scale = options.scale ?? 1;
        const opacity = options.opacity ?? 1;
        const partyCardScale = options.party_card_scale ?? 1;
        const backgroundOpacity = options.background_opacity ?? 1;
        const preset = options.preset === 'default' ? 'modern' : (options.preset || 'modern');
        document.documentElement.style.setProperty('--x', `${x}%`);
        document.documentElement.style.setProperty('--y', `${y}%`);
        document.documentElement.style.setProperty('--scale', scale);
        document.documentElement.style.setProperty('--opacity', opacity);
        document.documentElement.style.setProperty('--primary-bg-strong', (0.97 * backgroundOpacity).toFixed(3));
        document.documentElement.style.setProperty('--primary-bg-mid', (0.95 * backgroundOpacity).toFixed(3));
        document.documentElement.style.setProperty('--party-bg-strong', (0.91 * backgroundOpacity).toFixed(3));
        document.documentElement.style.setProperty('--party-bg-mid', (0.88 * backgroundOpacity).toFixed(3));
        document.documentElement.style.setProperty('--minimal-card-bg', (0.91 * backgroundOpacity).toFixed(3));
        document.documentElement.dataset.overlayPreset = preset;
        const primary = $('primary');
        primary.style.position = 'fixed';
        primary.style.left = `${x}%`;
        primary.style.top = `${y}%`;
        primary.style.transform = `scale(${scale})`;
        primary.style.opacity = opacity;
        $('party').style.transform = `scale(${scale * (preset === 'minimal' ? 1 : partyCardScale)})`;
        document.documentElement.style.setProperty('--transition-duration', `${options.transition_seconds ?? 4}s`);
        primary.classList.toggle('hide-world-icon', options.show_world_icon === false);
        primary.classList.toggle('hide-school-icon', options.show_school_icon === false);
        $('primary-world-icon').classList.toggle('hidden', options.show_world_icon === false);
        $('primary-school-icon').classList.toggle('hidden', options.show_school_icon === false);
        $('arrival-icon').classList.toggle('hidden', options.show_world_icon === false);

        if (state.wizard) {
          $('primary-name').textContent = state.wizard.name;
          $('primary-school').textContent = state.wizard.school ? `· ${state.wizard.school}` : '';
          setSchoolIcon($('primary-school-icon'), state.wizard.school);
          $('identity').className = `identity ${schoolClass(state.wizard.school)}`;
          applySchoolPalette($('identity'), state.wizard.school);
          applySchoolPalette(primary, state.wizard.school);
        } else {
          $('primary-name').textContent = 'Choose a character in Settings';
          $('primary-school').textContent = '';
          $('primary-school-icon').removeAttribute('src');
          $('identity').className = 'identity';
        }

        const world = visible(state.world);
        const zone = visible(state.zone);
        $('world-name').textContent = world;
        $('world-name').classList.toggle('hidden', !world);
        $('zone-name').textContent = zone;
        $('zone-name').classList.toggle('hidden', !zone);
        setWorldIcon($('primary-world-icon'), state.world_icon);
        updatePartyAnchor();

        traceOverlayLayout('before-roster', state);
        renderParty(state.party || [], options);
        traceOverlayLayout('after-roster', state);

        if (options.zone_transition !== false && state.active && state.raw_zone && previousZone !== null && state.raw_zone !== previousZone) {
          $('arrival-world').textContent = world;
          $('arrival-world').classList.toggle('hidden', !world);
          $('arrival-zone').textContent = zone;
          $('arrival-zone').classList.toggle('hidden', !zone);
          setWorldIcon($('arrival-icon'), state.world_icon);
          $('arrival').classList.remove('show');
          void $('arrival').offsetWidth;
          $('arrival').classList.add('show');
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => $('arrival').classList.remove('show'), (options.transition_seconds ?? 4) * 1000);
        }
        previousZone = state.raw_zone;
      }

      Promise.all([fetch('/school-palette.json').then((response) => response.json()), fetch('/state').then((response) => response.json())])
        .then(([palette, state]) => { schoolPalette = palette; render(state); })
        .catch(() => {});
      const events = new EventSource('/events');
      if (layoutDebug) window.__overlayEvents = events;
      new ResizeObserver(updatePartyAnchor).observe($('primary'));
      events.addEventListener('state', (event) => {
        const state = JSON.parse(event.data);
        if (Object.keys(schoolPalette).length) render(state);
        else fetch('/school-palette.json').then((response) => response.json()).then((palette) => { schoolPalette = palette; render(state); }).catch(() => render(state));
      });
    </script>
  </body>
</html>
