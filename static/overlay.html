<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>WizRust101 OBS</title></head>
<body><main id="overlay"><section id="primary" class="primary"><span class="crest" aria-hidden="true">✧</span><div class="primary-copy"><div class="eyebrow">YOUR WIZARD</div><div id="identity" class="identity"></div><div id="location" class="location"></div><div id="session" class="session"></div></div></section><section id="party" class="party" aria-label="Other wizards in your party"></section><section id="arrival" class="arrival" aria-live="polite"><div id="arrival-world" class="arrival-world"></div><div id="arrival-zone" class="arrival-zone"></div></section></main>
<script>
const $=id=>document.getElementById(id);let lastRaw=null,hideTimer,current={active:false,session_seconds:0},receivedAt=Date.now();
function time(n){n=Math.max(0,Math.floor(n));return `${String(Math.floor(n/3600)).padStart(2,'0')}:${String(Math.floor(n/60)%60).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function schoolClass(s){return ['fire','ice','storm','myth','life','death'].includes(String(s).toLowerCase())?String(s).toLowerCase():'balance'}
function render(s){current=s;receivedAt=Date.now();const o=s.overlay||{};document.documentElement.style.setProperty('--x',(o.x_percent??4)+'%');document.documentElement.style.setProperty('--y',(o.y_percent??87)+'%');document.documentElement.style.setProperty('--scale',o.scale??1);document.documentElement.style.setProperty('--opacity',o.opacity??.92);document.documentElement.style.setProperty('--transition-duration',(o.transition_seconds??4)+'s');$('primary').classList.toggle('hidden',o.character_location===false);const wizard=s.wizard; if(wizard){$('identity').textContent=`${wizard.name}  •  ${wizard.school}`;$('identity').className=`identity ${schoolClass(wizard.school)}`}else{$('identity').textContent='Choose a wizard in Spellbook Settings';$('identity').className='identity'};$('location').textContent=[s.world,s.zone].filter(Boolean).join(' — ');$('session').textContent=s.active?`SESSION  ${time(s.session_seconds)}`:'';const party=$('party');party.replaceChildren();for(const peer of s.party||[]){const card=document.createElement('article');card.className='party-card';const label=document.createElement('div');label.className='party-label';label.textContent='PARTY • OTHER WIZARD';const name=document.createElement('div');name.className='party-name';name.textContent=`${peer.name} • ${peer.school}`;const where=document.createElement('div');where.className='party-location';where.textContent=[peer.world,peer.zone].filter(Boolean).join(' — ')||'Location unknown';const session=document.createElement('div');session.className='party-session';session.textContent=peer.active?'SESSION  '+time(peer.session_seconds):'';card.append(label,name,where,session);party.append(card)}if(o.zone_transition!==false&&s.active&&s.raw_zone&&lastRaw!==null&&s.raw_zone!==lastRaw){$('arrival-world').textContent=s.world||'';$('arrival-zone').textContent=s.zone||'Location unknown';$('arrival').classList.remove('show');void $('arrival').offsetWidth;$('arrival').classList.add('show');clearTimeout(hideTimer);hideTimer=setTimeout(()=>$('arrival').classList.remove('show'),(o.transition_seconds??4)*1000)}lastRaw=s.raw_zone}
setInterval(()=>{if(current.active)$('session').textContent=`SESSION  ${time(current.session_seconds+Math.floor((Date.now()-receivedAt)/1000))}`},1000);fetch('/state').then(r=>r.json()).then(render).catch(()=>{});const events=new EventSource('/events');events.addEventListener('state',e=>render(JSON.parse(e.data)));
</script></body></html>
